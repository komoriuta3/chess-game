<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chess 02 - Mobile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden}
body{background:#151515;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{width:100%;max-width:700px;margin:auto;padding:10px 8px 18px}
header{text-align:center;padding:2px 0 9px}
h1{margin:0;font-size:25px;line-height:1.2}
.sub{font-size:12px;color:#aaa;margin-top:2px}
.controls{display:flex;gap:8px;align-items:end;margin-bottom:8px}
.control{flex:1}.control label{display:block;color:#bbb;font-size:13px;margin-bottom:3px}
select,button{font:inherit;color:#fff;background:#292929;border:1px solid #555;border-radius:9px}
select{width:100%;height:44px;padding:0 10px}
#new{height:44px;padding:0 12px;white-space:nowrap}
.status{text-align:center;background:#202020;border:1px solid #3b3b3b;border-radius:9px;padding:9px;margin-bottom:10px;font-size:14px;font-weight:600}
.board{width:min(96vw,620px);height:min(96vw,620px);margin:auto;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:4px solid #4c321f;border-radius:8px;overflow:hidden;box-shadow:0 8px 25px #0008}
.sq{min-width:0;min-height:0;border:0;border-radius:0;padding:0;display:flex;align-items:center;justify-content:center;position:relative;font-family:"DejaVu Sans","Segoe UI Symbol",serif;font-size:clamp(30px,10.2vw,67px);line-height:1;touch-action:manipulation}
.light{background:#ead8b8}.dark{background:#8b6242}
.sq.sel{outline:4px solid #f1c34b;outline-offset:-4px}
.sq.move::after{content:"";position:absolute;width:20%;height:20%;border-radius:50%;background:#315f36aa}
.sq.cap::after{content:"";position:absolute;inset:8%;border:4px solid #a53b3baa;border-radius:50%}
.white{color:#fff;filter:drop-shadow(0 2px 1px #555);z-index:2}
.black{color:#111;filter:drop-shadow(0 2px 1px #000);z-index:2}
.info{text-align:center;color:#999;font-size:11px;margin-top:8px}
@media(max-width:380px){
 .app{padding-left:5px;padding-right:5px}.board{width:97vw;height:97vw}
 .sq{font-size:11vw}.controls{gap:5px}#new{padding:0 8px;font-size:13px}
}
</style>
</head>
<body>
<main class="app">
<header><h1>♟ Chess 02</h1><div class="sub">あなた（白） vs CPU（黒）　<span style="color:#777">v5</span></div></header>
<div class="controls">
  <div class="control"><label for="level">CPU難易度</label>
    <select id="level"><option value="1">入門</option><option value="2">初級</option><option value="3" selected>中級</option><option value="4">上級</option></select>
  </div>
  <button id="new">新しいゲーム</button>
</div>
<div id="status" class="status">あなたの手番です</div>
<div id="board" class="board"></div>
<div class="info">駒をタップ → 移動先をタップしてください</div>

<script>
"use strict";

const ICON={K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙",k:"♚",q:"♛",r:"♜",b:"♝",n:"♞"};
const START=[
 ["r","n","b","q","k","b","n","r"],
 ["p","p","p","p","p","p","p","p"],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["P","P","P","P","P","P","P","P"],
 ["R","N","B","Q","K","B","N","R"]
];

let board,turn,selected,gameOver,castle,ep,lastMove;

const $=id=>document.getElementById(id);
const copy=x=>x.map(r=>r.slice());
const white=p=>!!p && p===p.toUpperCase();
const black=p=>!!p && p===p.toLowerCase();
const inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const enemy=(p,side)=>p&&(side==="w"?black(p):white(p));

function reset(){
 board=copy(START); ensureInitialPosition(); turn="w"; selected=null; gameOver=false;
 castle={K:true,Q:true,k:true,q:true}; ep=null; lastMove=null;
 $("status").textContent="あなたの手番です"; render();
}

function findKing(x,side){
 const k=side==="w"?"K":"k";
 for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(x[r][c]===k)return [r,c];
 return [-1,-1];
}

function attacked(x,r,c,by){
  const pawn = by==="w" ? "P" : "p";
  const knight = by==="w" ? "N" : "n";
  const king = by==="w" ? "K" : "k";

  // Pawn attacks
  const py = by==="w" ? r+1 : r-1;
  for(const dc of [-1,1]){
    const pc=c+dc;
    if(inside(py,pc) && x[py][pc]===pawn) return true;
  }

  // Knight attacks
  const jumps=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
  for(const [dr,dc] of jumps)
    if(inside(r+dr,c+dc) && x[r+dr][c+dc]===knight) return true;

  // King attacks
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    if((dr||dc) && inside(r+dr,c+dc) && x[r+dr][c+dc]===king) return true;
  }

  // Sliding pieces. The first occupied square on a ray is the only piece
  // that can attack the target.
  const rays=[
    [[1,0],["R","Q"]],[[-1,0],["R","Q"]],[[0,1],["R","Q"]],[[0,-1],["R","Q"]],
    [[1,1],["B","Q"]],[[1,-1],["B","Q"]],[[-1,1],["B","Q"]],[[-1,-1],["B","Q"]]
  ];
  for(const [[dr,dc],pieces] of rays){
    let rr=r+dr,cc=c+dc;
    while(inside(rr,cc)){
      const p=x[rr][cc];
      if(p){
        const wanted=by==="w"?pieces.map(v=>v):pieces.map(v=>v.toLowerCase());
        if(wanted.includes(p)) return true;
        break;
      }
      rr+=dr;cc+=dc;
    }
  }
  return false;
}

function pseudo(x,r,c,side,allowCastle=true){
 const p=x[r][c], P=p&&p.toLowerCase(), out=[], d=side==="w"?-1:1;
 const add=(rr,cc)=>{if(inside(rr,cc)&&(!x[rr][cc]||enemy(x[rr][cc],side)))out.push([rr,cc])};

 if(P==="p"){
  const rr=r+d;
  if(inside(rr,c)&&!x[rr][c]){
   out.push([rr,c]);
   if((side==="w"?r===6:r===1)&&!x[r+2*d][c])out.push([r+2*d,c]);
  }
  for(const dc of [-1,1]){
   const cc=c+dc;
   if(inside(rr,cc)&&(enemy(x[rr][cc],side)||(ep&&ep[0]===rr&&ep[1]===cc)))out.push([rr,cc]);
  }
 }
 if(P==="n")for(const q of [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])add(r+q[0],c+q[1]);

 if(P==="k"){
  for(let a=-1;a<=1;a++)for(let d2=-1;d2<=1;d2++)if(a||d2)add(r+a,c+d2);
  const row=side==="w"?7:0, opp=side==="w"?"b":"w";
  if(allowCastle&&c===4&&!attacked(x,row,4,opp)){
   const ks=side==="w"?"K":"k", qs=side==="w"?"Q":"q", rook=side==="w"?"R":"r";
   if(castle[ks]&&x[row][5]===""&&x[row][6]===""&&x[row][7]===rook&&!attacked(x,row,5,opp)&&!attacked(x,row,6,opp))out.push([row,6]);
   if(castle[qs]&&x[row][1]===""&&x[row][2]===""&&x[row][3]===""&&x[row][0]===rook&&!attacked(x,row,3,opp)&&!attacked(x,row,2,opp))out.push([row,2]);
  }
 }
 const slide=dirs=>{
  for(const [a,d2] of dirs){
   let rr=r+a,cc=c+d2;
   while(inside(rr,cc)){
    if(!x[rr][cc])out.push([rr,cc]);
    else{if(enemy(x[rr][cc],side))out.push([rr,cc]);break}
    rr+=a;cc+=d2;
   }
  }
 };
 if(P==="b"||P==="q")slide([[1,1],[1,-1],[-1,1],[-1,-1]]);
 if(P==="r"||P==="q")slide([[1,0],[-1,0],[0,1],[0,-1]]);
 return out;
}

function applyMove(x,a,m,side){
 const n=copy(x), p=n[a[0]][a[1]], capture=n[m[0]][m[1]];
 n[m[0]][m[1]]=p; n[a[0]][a[1]]="";

 if(p.toLowerCase()==="p"&&ep&&m[0]===ep[0]&&m[1]===ep[1]&&!capture)n[a[0]][m[1]]="";
 if(p.toLowerCase()==="p"&&(m[0]===0||m[0]===7))n[m[0]][m[1]]=side==="w"?"Q":"q";

 if(p==="K"&&a[1]===4&&m[1]===6){n[7][5]=n[7][7];n[7][7]="";}
 if(p==="K"&&a[1]===4&&m[1]===2){n[7][3]=n[7][0];n[7][0]="";}
 if(p==="k"&&a[1]===4&&m[1]===6){n[0][5]=n[0][7];n[0][7]="";}
 if(p==="k"&&a[1]===4&&m[1]===2){n[0][3]=n[0][0];n[0][0]="";}
 return n;
}

function legal(x,r,c,side){
 const out=[];
 for(const m of pseudo(x,r,c,side)){
  const n=applyMove(x,[r,c],m,side), k=findKing(n,side);
  if(k[0]>=0&&!attacked(n,k[0],k[1],side==="w"?"b":"w"))out.push(m);
 }
 return out;
}

function allMoves(x,side){
 const out=[];
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  if(x[r][c]&&(side==="w"?white(x[r][c]):black(x[r][c])))
   for(const m of legal(x,r,c,side))out.push([[r,c],m]);
 }
 return out;
}

function makeMove(a,m,side){
 const p=board[a[0]][a[1]], captured=board[m[0]][m[1]];
 board=applyMove(board,a,m,side);

 if(p==="K"){castle.K=false;castle.Q=false}
 if(p==="k"){castle.k=false;castle.q=false}
 if(p==="R"&&a[0]===7&&a[1]===0)castle.Q=false;
 if(p==="R"&&a[0]===7&&a[1]===7)castle.K=false;
 if(p==="r"&&a[0]===0&&a[1]===0)castle.q=false;
 if(p==="r"&&a[0]===0&&a[1]===7)castle.k=false;

 if(captured==="R"&&m[0]===7&&m[1]===0)castle.Q=false;
 if(captured==="R"&&m[0]===7&&m[1]===7)castle.K=false;
 if(captured==="r"&&m[0]===0&&m[1]===0)castle.q=false;
 if(captured==="r"&&m[0]===0&&m[1]===7)castle.k=false;

 ep=(p.toLowerCase()==="p"&&Math.abs(m[0]-a[0])===2)?[(a[0]+m[0])/2,m[1]]:null;
 lastMove=[a,m]; selected=null; turn=side==="w"?"b":"w"; render(); afterMove();
}

function afterMove(){
 const moves=allMoves(board,turn), k=findKing(board,turn);
 const inCheck=k[0]>=0 && attacked(board,k[0],k[1],turn==="w"?"b":"w");
 if(!moves.length){
  gameOver=true;
  if(inCheck){
   $("status").textContent=turn==="w"?"チェックメイト。CPUの勝ちです。":"チェックメイト。あなたの勝ちです。";
  }else{
   $("status").textContent="ステイルメイト。引き分けです。";
  }
  return;
 }
 if(turn==="w")$("status").textContent=inCheck?"王手です。あなたの手番です":"あなたの手番です";
 else{
  $("status").textContent=inCheck?"CPUが王手を受けています。考えています…":"CPUが考えています…";
  setTimeout(cpuMove,120);
 }
}

const VAL={p:100,n:320,b:330,r:500,q:900,k:20000};

function evaluate(x){
 let s=0;
 for(const row of x)for(const p of row)if(p)s+=(white(p)?1:-1)*VAL[p.toLowerCase()];
 return s;
}

function minimax(x,side,depth,alpha,beta){
 const moves=allMoves(x,side);
 if(depth===0||!moves.length)return evaluate(x);
 if(side==="w"){
  let best=-Infinity;
  for(const m of moves){best=Math.max(best,minimax(applyMove(x,m[0],m[1],side),"b",depth-1,alpha,beta));alpha=Math.max(alpha,best);if(alpha>=beta)break}
  return best;
 }else{
  let best=Infinity;
  for(const m of moves){best=Math.min(best,minimax(applyMove(x,m[0],m[1],side),"w",depth-1,alpha,beta));beta=Math.min(beta,best);if(alpha>=beta)break}
  return best;
 }
}

function cpuMove(){
 if(gameOver||turn!=="b")return;
 const moves=allMoves(board,"b");
 if(!moves.length){afterMove();return}
 const level=Number($("level").value);
 let best=[];
 if(level===1){
  best=[moves[Math.floor(Math.random()*moves.length)]];
 }else if(level===2){
  let scored=moves.map(m=>({m,s:(board[m[1][0]][m[1][1]]?VAL[board[m[1][0]][m[1][1]].toLowerCase()]:0)+Math.random()*120}));
  scored.sort((a,b)=>b.s-a.s);
  best=[scored[Math.floor(Math.random()*Math.min(4,scored.length))].m];
 }else{
  const depth=level===3?2:3;
  let value=Infinity;
  for(const m of moves){
   const v=minimax(applyMove(board,m[0],m[1],"b"),"w",depth-1,-Infinity,Infinity);
   if(v<value){value=v;best=[m]}else if(v===value)best.push(m);
  }
 }
 const chosen=best[Math.floor(Math.random()*best.length)];
 makeMove(chosen[0],chosen[1],"b");
}

function tap(r,c){
 if(gameOver||turn!=="w")return;
 const p=board[r][c];
 if(selected){
  const moves=legal(board,selected[0],selected[1],"w");
  const m=moves.find(q=>q[0]===r&&q[1]===c);
  if(m){makeMove(selected,m,"w");return}
  if(p&&white(p)){selected=[r,c];render();return}
  selected=null;render();return;
 }
 if(p&&white(p)){selected=[r,c];render()}
}

function ensureInitialPosition(){
  if(!board || board.length!==8) board=copy(START);
  const blackPawns=board[1].filter(p=>p==="p").length;
  if(blackPawns!==8){
    board[1]=["p","p","p","p","p","p","p","p"];
  }
}
function render(){
 const el=$("board");el.replaceChildren();
 const selectedMoves=selected?legal(board,selected[0],selected[1],"w"):[];
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const q=document.createElement("button");
  q.className="sq "+((r+c)%2?"dark":"light");
  if(selected&&selected[0]===r&&selected[1]===c)q.classList.add("sel");
  if(lastMove&&((lastMove[0][0]===r&&lastMove[0][1]===c)||(lastMove[1][0]===r&&lastMove[1][1]===c)))q.style.boxShadow="inset 0 0 0 999px rgba(240,195,75,.18)";
  if(selectedMoves.some(m=>m[0]===r&&m[1]===c))q.classList.add(board[r][c]?"cap":"move");
  const p=board[r][c];
  if(p){const s=document.createElement("span");s.className=white(p)?"white":"black";s.textContent=ICON[p] || (p.toLowerCase()==="p" ? "♟" : p.toUpperCase());q.appendChild(s)}
  q.onclick=()=>tap(r,c);el.appendChild(q);
 }
}


function selfTest(){
  const t=Array.from({length:8},()=>Array(8).fill(""));
  t[1][6]="k";                 // black king g7
  t[0][4]="Q";                 // white queen e8
  t[1][4]="B";                 // white bishop e7
  t[1][2]="N";                 // white knight c7
  if(attacked(t,1,7,"w")) throw new Error("Chess rule test failed: h7 incorrectly marked attacked");
  const moves=legal(t,1,6,"b");
  if(!moves.some(m=>m[0]===1&&m[1]===7)) throw new Error("Chess rule test failed: Kg7-h7 was rejected");
}

$("new").onclick=reset;
reset();
selfTest();
</script>
</main>
</body>
</html>
